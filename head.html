<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="urn:adobe:aue:system:aemconnection" content="aem:http://localhost:4502">
<meta name="urn:adobe:aue:config:service" content="https://universal-editor-service.experiencecloud.live">
<script nonce="aem">
  /* Load Universal Editor CORS bridge only when running in AEM author context.
     Skipped in localhost dev-server, headless Playwright validation, and CI to
     prevent ERR_NAME_NOT_RESOLVED console errors in non-author environments. */
  (function () {
    var h = window.location.hostname;
    if (h && h !== 'localhost' && !h.startsWith('127.') && !h.startsWith('::1')) {
      var s = document.createElement('script');
      s.src = 'https://universal-editor-service.experiencecloud.live/cors.js';
      s.async = true;
      document.head.appendChild(s);
    }
  }());
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
